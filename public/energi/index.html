<script>
  // the app's own tone and light/dark choice, before the first paint (no flash)
  try {
    const q = new URLSearchParams(location.search), d = document.documentElement;
    const get = (k, v) => q.get(k) || JSON.parse(localStorage.getItem(k) || JSON.stringify(v));
    const tone = get('tone', 'daempet'), mode = get('mode', 'auto'), dark = get('dark', 'notion');
    if (tone !== 'daempet') d.dataset.tone = tone;
    if (mode !== 'auto') d.dataset.theme = mode;
    if (dark !== 'notion') d.dataset.dark = dark;
    document.querySelector('meta[name="color-scheme"]').content = mode === 'light' ? 'light' : mode === 'dark' ? 'dark' : 'light dark';
    // the app's text size ('textSize'; 'size' before 17/10)
    const ts = JSON.parse(localStorage.getItem('textSize') || localStorage.getItem('size') || '"auto"');
    if (ts !== 'auto' && +ts) d.style.setProperty('--ts', ts);
  } catch (e) {}
  // ?embed=1: the app's Økonomi tab shows this page in a frame under its own bar. The page's bar and its way back go,
  // and it wears exactly the look the app wears now – the app's light or dark, tone, palette and text size (the app's
  // own setting, a ?theme= of its address, or the phone's text size), and again whenever the app changes it
  try {
    if (new URLSearchParams(location.search).get('embed') === '1' && parent !== window) {
      const d = document.documentElement, p = parent.document.documentElement;
      d.classList.add('embed');
      const follow = () => { try {
        for (const k of ['theme', 'tone', 'dark']) { if (p.dataset[k]) d.dataset[k] = p.dataset[k]; else delete d.dataset[k]; }
        const ts = p.style.getPropertyValue('--tsu').trim();
        if (+ts) d.style.setProperty('--ts', ts); else d.style.removeProperty('--ts');
        const m = p.dataset.theme;
        document.querySelector('meta[name="color-scheme"]').content = m === 'light' ? 'light' : m === 'dark' ? 'dark' : 'light dark';
      } catch (e) {} };
      follow();
      new MutationObserver(follow).observe(p, { attributes: true, attributeFilter: ['data-theme', 'data-tone', 'data-dark', 'style'] });
    }
  } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&text=%D8%AD%D8%A8%D8%B1&display=block" media="print" onload="this.media='all'">
<!-- the headline face, as on the app's front page (The Economist's manner): Source Serif 4, for the headline lines only -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400..700&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="../style.css">
<style>
  /* Økonomi: the app's look (its tokens, bar, blocks and story rows come from style.css). Six sections in a dock at the
     bottom, in the thumb's reach; each opens with a red fly title and a serif headline line in the manner of The
     Economist; figures are rows that open in place with a chart and what the number means; colour only for up/down
     next to an arrow, red only for the fly title, the short rules and the chosen section */
  :root { --up: #2f7a52; --edock: calc(52px + var(--bottom)); --display: "Source Serif 4", "Source Serif Pro", Georgia, serif; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --up: #4cc38a; } }
  :root[data-theme="dark"] { --up: #4cc38a; }
  main.en { max-width: 680px; margin: 0 auto; padding: calc(var(--barh) + 2px) 0 calc(var(--edock) + 20px); font-size: var(--fs-body); }
  .bar > .brand { max-width: 680px; }
  .en-home { flex: none; display: flex; align-items: center; gap: 2px; min-height: 44px; margin-left: -10px; padding: 0 4px; color: var(--text); }
  .en-home > svg { width: 20px; height: 20px; color: var(--text-2); transform: scaleX(-1); }
  .en-home .logo { width: 38px; height: 28px; }
  .en-title { margin: 0 0 0 8px; font-size: calc(18px * var(--ts, 1)); font-weight: 720; letter-spacing: -.015em; }

  /* the section's head: a red fly title, the headline line in the serif, a calm line under it */
  .ec-top { padding: 18px 16px 2px; }
  .ec-fly { display: block; font-size: var(--fs-cap); font-weight: 750; letter-spacing: .09em; text-transform: uppercase; color: var(--red); }
  .ec-head { margin: 6px 0 0; font-family: var(--display); font-size: var(--fs-title); font-weight: 700; line-height: 1.14; letter-spacing: -.012em;
    font-variation-settings: "opsz" 60; text-wrap: balance; }
  .ec-stand { margin: 8px 0 0; font-size: var(--fs-small); line-height: 1.45; color: var(--text-2); text-wrap: pretty; }
  .en .block { margin-top: 22px; }
  .en .block-h h2 { position: relative; padding-top: 9px; font-size: var(--fs-lead); font-weight: 760; }
  .en .block-h h2::before { content: ""; position: absolute; top: 0; left: 0; width: 26px; height: 3px; background: var(--red); }
  .en-hint { margin: 0 16px 4px; font-size: var(--fs-meta); line-height: 1.45; color: var(--text-3); }

  /* the choices under a section: the app's chips, in one row that scrolls sideways when the text is large */
  .ec-chips { display: flex; gap: 8px; overflow-x: auto; margin: 14px 0 6px; padding: 4px 16px; scrollbar-width: none; }
  .ec-chips::-webkit-scrollbar { display: none; }
  .ec-chips .chip { flex: none; min-height: 36px; }

  /* Lige nu: short 'Who: what' lines, like the wire */
  .en-sig { list-style: none; margin: 0; padding: 0 16px; }
  .en-sig li { padding: 9px 0 10px; font-size: var(--fs-small); line-height: 1.42; letter-spacing: -.005em; }
  .en-sig li + li { border-top: 1px solid var(--line); }
  .en-sig b { font-weight: 700; }
  .en-sig .q { color: var(--text-3); white-space: nowrap; }

  /* the big numbers: two panels side by side (12 from the edge, 12 inside, radius 16 – the app's panel) */
  .ec-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 14px 12px 0; }
  .ec-tile { min-width: 0; padding: 12px; border-radius: var(--r-panel); background: var(--fill); }
  .ec-tile.ec-span { grid-column: 1 / -1; }
  .ec-k { display: block; font-size: var(--fs-meta); font-weight: 650; color: var(--text-2); }
  .ec-v { display: block; margin-top: 4px; font-size: calc(30px * var(--ts, 1)); font-weight: 720; line-height: 1.05; letter-spacing: -.02em; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ec-v small { margin-left: 3px; font-size: var(--fs-meta); font-weight: 600; letter-spacing: 0; color: var(--text-3); }
  .ec-l { display: block; margin-top: 6px; font-size: var(--fs-meta); line-height: 1.4; color: var(--text-3); }
  .ec-l b { color: var(--text-2); font-weight: 650; }
  .ec-share { display: flex; height: 6px; margin-top: 8px; border-radius: 3px; overflow: hidden; background: var(--fill-2); }
  .ec-share i { display: block; background: var(--text-2); }

  /* one figure: name and its time at the left, three months in a small line, value and day's move at the right */
  .en-item { position: relative; }
  .en-item + .en-item::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: 1px solid var(--line); }
  .en-item.open { background-color: var(--fill); }
  .en-item.open::before, .en-item.open + .en-item::before { opacity: 0; }
  .en-row { display: grid; grid-template-columns: minmax(0, 1fr) 64px 96px; align-items: center; gap: 12px; width: 100%;
    min-height: calc(58px * var(--ts, 1)); padding: 8px 16px; text-align: left; }
  .en-row:active { background-color: var(--fill); }
  .en-name { min-width: 0; }
  .en-name b { display: block; font-size: var(--fs-body); font-weight: 650; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .en-name small { display: block; margin-top: 2px; font-size: var(--fs-meta); color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  svg.en-spark { width: 64px; height: 26px; overflow: visible; }
  .en-spark path { fill: none; stroke: var(--text-2); stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
  .en-spark circle { fill: var(--text); }
  .en-val { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .en-v { display: block; font-size: calc(17px * var(--ts, 1)); font-weight: 650; letter-spacing: -.01em; }
  .en-c { display: block; margin-top: 2px; font-size: var(--fs-meta); font-weight: 600; color: var(--text-3); }
  .en-c.up { color: var(--up); }
  .en-c.down { color: var(--pulse); }

  /* opened: a chart you can touch, its ranges, and what the number means */
  .en-more { padding: 0 16px 16px; }
  .en-range { display: flex; flex-wrap: wrap; gap: 2px; margin: -2px 0 2px -6px; }
  .en-range button { min-height: 44px; padding: 0 4px; display: grid; place-items: center; }
  .en-range span { padding: 5px 11px; border-radius: 14px; font-size: var(--fs-meta); font-weight: 650; color: var(--text-2); }
  .en-range button[aria-pressed="true"] span { background: var(--fill-2); color: var(--text); }
  .en-item.open .en-range button[aria-pressed="true"] span { background: var(--bg); }
  .block > .en-range, .ec-pad > .en-range { margin-left: 10px; }
  .en-chart { position: relative; height: 172px; touch-action: pan-y; -webkit-user-select: none; user-select: none; }
  .en-chart svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .en-chart .grid { stroke: var(--line); stroke-width: 1; }
  .en-chart .zero { stroke: var(--text-3); stroke-width: 1; stroke-dasharray: 3 3; }
  .en-chart .ln { fill: none; stroke: var(--text); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .en-chart .ln.two { stroke: var(--text-3); stroke-dasharray: 5 4; }
  .en-chart .ln.red { stroke: var(--red); }
  .en-chart .pt { fill: var(--text); stroke: var(--fill); stroke-width: 2; }
  .en-chart .lbl { fill: var(--text-3); font-size: 11px; font-variant-numeric: tabular-nums; }
  .en-chart .tag { fill: var(--text-2); font-size: 11.5px; font-weight: 650; }
  .en-chart .cross { stroke: var(--text-3); stroke-width: 1; }
  .en-tip { position: absolute; top: -4px; transform: translate(-50%, -100%); padding: 3px 8px; border-radius: 8px; background: var(--text); color: var(--bg);
    font-size: var(--fs-meta); font-weight: 650; white-space: nowrap; pointer-events: none; font-variant-numeric: tabular-nums; }
  .en-hl { margin: 8px 0 0; font-size: var(--fs-meta); color: var(--text-2); font-variant-numeric: tabular-nums; }
  .en-src { margin: 10px 0 0; font-size: var(--fs-meta); color: var(--text-3); }
  .en-seg { display: inline-flex; gap: 2px; margin: 0 0 2px -6px; }
  .ec-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 6px 0 0; font-size: var(--fs-meta); color: var(--text-2); }
  .ec-legend i { display: inline-block; width: 16px; height: 0; margin-right: 6px; vertical-align: 3px; border-top: 2px solid var(--text); }
  .ec-legend i.two { border-top: 2px dashed var(--text-3); }
  .ec-legend i.red { border-top-color: var(--red); }
  .ec-pad { padding: 0 16px; }

  /* what it is, why to watch it now, what a rise and a fall mean */
  .ec-ex { margin: 12px 0 0; }
  .ec-ex dt { margin-top: 10px; font-size: var(--fs-meta); font-weight: 700; color: var(--text); }
  .ec-ex dd { margin: 2px 0 0; font-size: var(--fs-small); line-height: 1.45; color: var(--text-2); text-wrap: pretty; }
  .ec-ud { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .ec-ud dt .a { margin-right: 4px; font-size: .85em; }
  .ec-ud .up .a { color: var(--up); }
  .ec-ud .down .a { color: var(--pulse); }

  /* Danish pump prices: one line per chain, the cheapest in bold */
  .en-pump { width: calc(100% - 32px); margin: 0 16px; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  .en-pump th { padding: 6px 0; font-size: var(--fs-cap); font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--text-3); text-align: right; }
  .en-pump th:first-child { text-align: left; }
  .en-pump th + th, .en-pump td + td { padding-left: 12px; white-space: nowrap; }
  .en-pump td { padding: 9px 0; border-top: 1px solid var(--line); font-size: var(--fs-body); text-align: right; color: var(--text-2); }
  .en-pump td:first-child { text-align: left; color: var(--text); }
  .en-pump td:first-child b { font-weight: 650; }
  .en-pump td small { display: block; margin-top: 1px; font-size: var(--fs-meta); color: var(--text-3); }
  .en-pump td.low { color: var(--text); font-weight: 700; }
  .en-pump tr.me td { color: var(--text); font-weight: 700; }
  .en-pump tr.avg td { font-style: italic; }
  .en-note { margin: 8px 16px 0; font-size: var(--fs-meta); line-height: 1.45; color: var(--text-3); }
  .en-note b { color: var(--text-2); font-weight: 650; }
  .en-plus { display: flex; align-items: center; gap: 2px; min-height: 44px; margin: 0 0 0 16px; font-size: var(--fs-small); font-weight: 600; color: var(--text-2); }
  .en-plus svg { width: 15px; height: 15px; transition: transform .2s var(--ease); }
  .en-plus[aria-expanded="true"] svg { transform: rotate(90deg); }
  .en-pchart { margin: 6px 16px 0; }
  .en-pchart .en-chart { height: 150px; }

  /* the US debt counter: an estimate between the Treasury's daily figures, and it says so */
  .ec-debt { margin: 14px 12px 0; padding: 14px 12px 12px; border-radius: var(--r-panel); background: var(--fill); }
  .ec-debt .ec-k { display: flex; justify-content: space-between; gap: 8px; }
  .ec-est { font-weight: 700; color: var(--red); letter-spacing: .04em; text-transform: uppercase; font-size: var(--fs-cap); }
  .ec-count { display: block; margin-top: 6px; font-size: min(var(--fs-title), 7.2vw); font-weight: 720; letter-spacing: -.02em; font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* debt in % of GDP: one bar per land, sorted, a tap opens its years */
  .ec-bar { display: grid; grid-template-columns: 108px minmax(0, 1fr) 62px; align-items: center; gap: 10px; width: 100%; min-height: 44px; padding: 4px 16px; text-align: left; }
  .ec-bar:active { background-color: var(--fill); }
  .ec-bar b { font-size: var(--fs-small); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ec-bar .tr { height: 10px; border-radius: 2px; background: var(--fill); overflow: hidden; }
  .ec-bar .tr i { display: block; height: 100%; background: var(--text-3); }
  .ec-bar.me .tr i { background: var(--text); }
  .ec-bar .n { text-align: right; font-size: var(--fs-small); font-weight: 650; font-variant-numeric: tabular-nums; }
  .en-item.bar-item + .en-item.bar-item::before { display: none; }
  .en-item.open .ec-bar .tr { background: var(--bg); }

  /* the bubble: a few plain points */
  .ec-pts { margin: 4px 16px 0; padding: 0; list-style: none; }
  .ec-pts li { padding: 10px 0; font-size: var(--fs-small); line-height: 1.48; color: var(--text-2); }
  .ec-pts li + li { border-top: 1px solid var(--line); }
  .ec-pts b { color: var(--text); font-weight: 700; }

  .en-news .row { text-align: left; }
  .en-news .story .row { height: auto; min-height: calc(64px * var(--ts, 1)); padding-top: 10px; padding-bottom: 10px; }   /* a row grows with its headline */
  .en-showmore { display: flex; align-items: center; gap: 2px; min-height: 44px; margin-left: 16px; font-size: var(--fs-small); font-weight: 600; color: var(--text-2); }
  .en-showmore svg { width: 15px; height: 15px; transform: rotate(90deg); }
  .ec-advice { margin: 18px 16px 0; padding-top: 12px; border-top: 1px solid var(--line); font-size: var(--fs-meta); line-height: 1.5; color: var(--text-3); text-align: center; }

  /* the dock: the six sections in the thumb's reach, the chosen one with a short red rule over it (solid, no blur) */
  .ec-dock { position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; padding-bottom: var(--bottom); background: var(--bg); box-shadow: 0 -1px 0 var(--line); }
  .ec-tabs { display: flex; max-width: 680px; margin: 0 auto; overflow-x: auto; scrollbar-width: none; }
  .ec-tabs::-webkit-scrollbar { display: none; }
  .ec-tabs button { position: relative; flex: 1 0 auto; min-height: 52px; padding: 0 9px; font-size: calc(13px * min(var(--ts, 1), 1.2)); font-weight: 600;
    color: var(--text-2); white-space: nowrap; }
  .ec-tabs button::before { content: ""; position: absolute; top: 0; left: 50%; width: 22px; height: 3px; margin-left: -11px; background: var(--red); opacity: 0; transition: opacity .15s; }
  .ec-tabs button[aria-selected="true"] { color: var(--text); font-weight: 750; }
  .ec-tabs button[aria-selected="true"]::before { opacity: 1; }
  .ec-tabs button:active { background: var(--fill); }
  @media (prefers-reduced-motion: no-preference) { #sec.in { animation: ecIn .2s var(--out); } }
  @keyframes ecIn { from { opacity: .35; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .en-plus svg, .ec-tabs button::before { transition: none; } }
  /* inside the app's Økonomi tab (?embed=1): no bar and no way back of its own – the app's bar is above it and its
     tabs below the frame, so the dock is the frame's own bottom */
  html.embed .bar { display: none; }
  html.embed main.en { padding-top: 0; }
  html.embed { --bottom: 0px; }
  html.embed, html.embed body { overscroll-behavior-x: auto; overscroll-behavior-y: none; }
</style>
</head>

  <div class="brand">

<script src="../config.js"></script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* private mode */ } },
};
const CFG = window.RADAR_CONFIG || {};
// the radar saves energy.json next to data.json (the data branch); locally both sit in public/
const SRC = CFG.energyUrl || new URL((CFG.dataUrl || 'data.json').replace(/data\.json(\?.*)?$/, 'energy.json'), new URL('../', location.href)).href;

// ---- what every figure is -------------------------------------------------------------------------------------------
const FUT = 'ICE/NYMEX-future via Yahoo Finance, ca. 10 min. forsinket';
const IDX = 'Indeks via Yahoo Finance, ca. 15 min. forsinket';
const STK = 'Aktiekurs i New York via Yahoo Finance, ca. 15 min. forsinket';
const EIA = 'Det amerikanske energiministerium (EIA) – et par dage bagud';
const EIAW = 'Det amerikanske energiministerium (EIA), målt hver mandag';
const CALC = 'Beregnet ud fra futures';
const OIL_UP = 'Dyrere benzin, diesel, fly og fragt og højere inflation – hårdest for lande, der importerer olie. Olieeksportører som Saudi-Arabien, Irak og Rusland får mere i statskassen.';
const OIL_DOWN = 'Billigere brændstof og lavere inflation; eksportlandene får mindre. Et fald kan også være et tegn på, at verdensøkonomien svækkes.';
const AI_UP = 'Investorerne tror mere på, at AI vil tjene de store investeringer hjem.';
const AI_DOWN = 'Tvivl om, hvornår – og om – de store investeringer i AI betaler sig.';
// n name · s unit · d decimals · kind: 'spread' (moves in $), 'pp' (a rate: moves in points), else % · w: weekly
const C = {
  brent: { n: 'Brent', s: '$/tønde', d: 2, src: FUT,
    what: 'Prisreferencen for omkring to tredjedele af verdens olie: Nordsø-olie, nærmeste månedskontrakt.',
    why: 'Omkring en femtedel af verdens olie sejler gennem Hormuz-strædet. Krig og trusler mod skibsfarten i Golfen og Det Røde Hav og sanktioner mod Rusland og Iran slår først ud her.',
    up: OIL_UP, down: OIL_DOWN },

    }

  } catch (e) { /* a missing number: the plain head */ }

// ---- Brændstof -----------------------------------------------------------------------------------------------------
function lowest() {
  const out = {};
  for (const c of (D.pumps && D.pumps.chains) || []) for (const [k, x] of Object.entries(c.p)) {
    if (!out[k] || x.v < out[k].v) out[k] = { v: x.v, who: [c.c] };
    else if (x.v === out[k].v) out[k].who.push(c.c);
  }
  return out;
}
const perL = (usdGal) => D.s.usddkk ? usdGal * D.s.usddkk.v / 3.78541 : null;
const euL = eur => D.s.eurdkk ? eur * D.s.eurdkk.v / 1000 : null;
function fuelTiles() {
  const low = lowest(), us = { benzin: D.s.us_gas, diesel: D.s.us_diesel }, eu = D.eu && D.eu.c && D.eu.c.EU;
  const tile = (k, i) => {
    const x = low[k];
    if (!x) return '';
    const cmp = [us[k] && perL(us[k].v) ? `USA <b>${nf(perL(us[k].v), 2)}</b>` : '', eu && euL(eu[i]) ? `EU-snit <b>${nf(euL(eu[i]), 2)}</b>` : ''].filter(Boolean).join(' · ');
    return `<div class="ec-tile"><span class="ec-k">${k === 'benzin' ? 'Benzin 95' : 'Diesel'} · billigst</span><span class="ec-v">${nf(x.v, 2)}<small>kr./l</small></span>
      <span class="ec-l">${esc(x.who.join(', '))}${cmp ? `<br>${cmp} kr.` : ''}</span></div>`;
  };
  const t = tile('benzin', 0) + tile('diesel', 1);
  return t ? `<div class="ec-tiles">${t}</div>` : '';
}
function pumps() {
  const P = D.pumps;
  if (!P || !P.chains || !P.chains.length) return '<p class="en-note">Pumpepriserne kunne ikke hentes lige nu.</p>';
  const low = lowest();
  // never more than three price columns on a phone: premium and HVO get a table of their own
  const table = (keys, first) => {
    const cols = keys.filter(k => P.chains.some(c => c.p[k]));
    if (!cols.length) return '';
    let t = `<table class="en-pump"><thead><tr><th>${first}</th>${cols.map(k => `<th>${esc(PUMP[k])}</th>`).join('')}</tr></thead><tbody>`;
    for (const c of P.chains) {
      if (!cols.some(k => c.p[k])) continue;
      t += `<tr><td><b>${esc(c.c)}</b>${first === 'Kæde' ? `<small>${c.n} stationer${c.chg ? ' · ændret ' + esc(when(c.chg)) : ''}</small>` : ''}</td>`;
      t += cols.map(k => {
        const x = c.p[k];
        if (!x) return '<td>–</td>';
        const cheaper = x.min < x.v - 1e-9 ? `<small>fra ${nf(x.min, 2)}</small>` : '';
        return `<td class="${low[k] && x.v === low[k].v ? 'low' : ''}">${nf(x.v, 2)}${cheaper}</td>`;
      }).join('') + '</tr>';
    }
    return t + '</tbody></table>';
  };
  let t = table(['benzin', 'diesel'], 'Kæde');
  if (pumpPlus) t += '<div style="height:14px"></div>' + table(['benzin_plus', 'diesel_plus', 'hvo'], 'Premium');
  const cheap = [];
  for (const c of P.chains) for (const k of ['benzin', 'diesel']) {
    const x = c.p[k];
    if (x && x.min < x.v - 1e-9 && x.at && x.at.length) cheap.push(`${esc(c.c)} ${esc(x.at.join(', '))}: ${PUMP[k].toLowerCase()} ${nf(x.min, 2)}`);
  }
  const listNote = `<p class="en-note">Kædernes listepris i kr. pr. liter (den pris de fleste stationer har)${cheap.length ? '. Billigere enkeltstationer: ' + cheap.slice(0, 4).join(' · ') : ''}.</p>`;
  const plus = `<button class="en-plus" id="pumpPlus" aria-expanded="${pumpPlus}">${pumpPlus ? 'Kun benzin og diesel' : 'Premium og HVO'}<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>`;
  return t + listNote + plus;
}

// the eight companies as one basket, each counting the same, against the S&P 500, both from 100 at the range's start
function aiSeries() {
  const maps = AI.map(k => D.s[k] && new Map(D.s[k].h)), spx = D.s.spx && new Map(D.s.spx.h);

  return { rs, r, ai, sp };
}

// ---- news (Olie) ---------------------------------------------------------------------------------------------------
function news() {
  const list = D.news || [];
  if (!list.length) return '<p class="en-note">Ingen nyheder om olie og brændstof de seneste tre døgn.</p>';
  // the app's language setting: Danish where there is a Danish version, else the original if readable, else English
  const danish = store.get('danish', true), readable = t => !/[؀-ۿ]/.test(t || '');
  // Israel's name in the app's house style in a Danish headline (as quoteIsrael in app.js): “israel”, “israelske”
  const qi = t => (t || '').replace(/[“"»„](israel[\p{L}\p{N}_]*)[”"«“]/giu, (_, w) => `“${w.toLowerCase()}”`)
    .replace(/(?<![\p{L}\p{N}_“/.:#=])(israel[\p{L}\p{N}_]*)(?![\p{L}\p{N}_”/])/giu, (_, w) => `“${w.toLowerCase()}”`);
  // the editor's headline, else a Danish outlet's own (the radar sends only those: the machine's Danish read badly)
  const pick = n => n.ed ? [qi(n.ed), n.kd] : n.l === 'da' ? [qi(n.o), n.k] : danish && n.da ? [qi(n.da), n.kd] : readable(n.o) ? [n.o, n.k] : [n.en || n.da || n.o, n.en ? n.k : n.kd];
  const tidy = t => (t || '').replace(/^(?:[←-⯿\u{1f000}-\u{1faff}️‍\s]|(?:breaking|urgent|عاجل)\s*[|:\-–]\s*)+/iu, '')
    .replace(/ (['’]s)\b/g, '$1');   // "EU 's" from the machine
  const words = (t, k) => {   // the app's bold: who and where
    let out = esc(t);
    for (const w of k || []) if (w && w.length > 1) out = out.replace(esc(w), `<b>${esc(w)}</b>`);
    return out;
  };
  const shown = newsAll ? list : list.slice(0, 8);
  const rows = shown.map(n => {
    const [t, k] = pick(n);
    return `<div class="story"><a class="row" href="${esc(n.u)}" target="_blank" rel="noopener"><span class="tx"><span class="h">${words(tidy(t), k)}</span><span class="m"><span class="src">${esc(n.s)}</span><span>${esc(when(n.p))}</span>${n.n > 1 ? `<span>${n.n} medier</span>` : ''}</span></span></a></div>`;
  }).join('');
  const moreBtn = !newsAll && list.length > 8 ? `<button class="en-showmore" id="newsMore">${list.length - 8} mere<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>` : '';
  return `<section class="block en-news"><div class="block-h"><h2>Energinyheder</h2></div>${rows}${moreBtn}</section>`;
}

}
function body(S) {
  const g = S.groups ? (S.groups.some(q => q[0] === group[S.id]) ? group[S.id] : S.groups[0][0]) : null;
  const [h, stand] = head(S.id);
  let out = `<header class="ec-top"><span class="ec-fly">${esc(S.fly)}</span><h2 class="ec-head">${esc(h)}</h2>${stand ? `<p class="ec-stand">${esc(stand)}</p>` : ''}</header>`;
  if (S.id === 'fuel') {
    const sig = signals();
    if (sig.length) out += `<section class="block"><div class="block-h"><h2>Lige nu</h2></div><ul class="en-sig">${sig.map(s => `<li>${s}</li>`).join('')}</ul></section>`;
    out += fuelTiles();
  }
  if (S.groups) out += chips(S, g);
  if (S.id === 'fuel') out += g === 'us' ? fuelUs() : g === 'eu' ? fuelEu() : fuelDk();
  else if (S.id === 'debt') out += g === 'land' ? debtLands() : debtUs();
  else if (S.id === 'ai') out += aiPage();
  else if (S.groups) {
    const G = S.groups.find(q => q[0] === g);
    if (g === 'news') out += news();
    else out += `${G[3] ? `<p class="en-hint">${esc(G[3])}</p>` : ''}<div class="en-rows">${G[2].map(k => rowFor(k)).join('') || WAIT}</div>`;
  } else out += `<div class="en-rows" style="margin-top:14px">${S.keys.map(k => rowFor(k)).join('') || WAIT}</div>`;
  return out;
}
function tabs() {
  $('#tabs').innerHTML = SECTIONS.map(S => `<button role="tab" data-sec="${S.id}" aria-selected="${S.id === sec}" aria-controls="sec">${esc(S.tab)}</button>`).join('');
}
function render(fade) {
  if (!D) return;
  const y = scrollY, box = $('#sec');
  box.innerHTML = body(SEC[sec]);
  box.setAttribute('aria-label', SEC[sec].fly);
  if (fade) { box.classList.remove('in'); void box.offsetWidth; box.classList.add('in'); }
  drawCharts(box);
  if (!fade) scrollTo(0, y);
  tick();
}
function foot() {
  $('#foot').innerHTML = 'Futures, indeks og aktier via Yahoo Finance (ca. 10–15 min. forsinket) · fysiske priser og amerikanske pumpepriser fra det amerikanske energiministerium (EIA) · europæiske pumpepriser fra EU-Kommissionen · vægte fra SPY-fondens beholdning (State Street) · USA’s gæld fra det amerikanske finansministerium · gæld i % af BNP fra IMF · danske pumpepriser fra Circle K og Q8 · nyheder fra Khabar. Opdateres hvert 5. minut.'
    + '<span class="ec-advice" style="display:block">Siden er information, ikke investeringsrådgivning. Den anbefaler hverken at købe eller sælge noget.</span>';
}
function go(id) {
  if (!SEC[id]) return;
  sec = id; store.set('ecSec', id);
  try { history.replaceState(null, '', '#' + UNHASH[id]); } catch (e) { /* a sandboxed frame */ }
  tabs();
  scrollTo(0, 0);
  render(true);
}

// the debt counter ticks only while it is on screen and the page is in view
let ticker = null;
function tick() {
  clearInterval(ticker); ticker = null;
  const el = $('#debtNow');
  if (!el || !D || !D.debt || !D.debt.g) return;
  ticker = setInterval(() => { if (!document.hidden && el.isConnected) el.textContent = whole(debtNow()) + ' $'; else if (!el.isConnected) clearInterval(ticker); },
    matchMedia('(prefers-reduced-motion: reduce)').matches ? 1000 : 250);
}

// ---- touch -----------------------------------------------------------------------------------------------------------
$('#tabs').addEventListener('click', e => { const b = e.target.closest('[data-sec]'); if (b) go(b.dataset.sec); });
$('#sec').addEventListener('click', e => {
  const t = e.target;
  const gr = t.closest('[data-group]'), rng = t.closest('[data-range]'), cur = t.closest('[data-curve]');
  if (gr) { group[sec] = gr.dataset.group; store.set('ecGroup', group); render(); return; }
  if (rng) {
    const holder = rng.closest('[data-for]'), it = rng.closest('.en-item');
    const k = holder && holder.dataset.for || (it && it.dataset.k);
    range[k] = rng.dataset.range; store.set('enRange', range);
    if (it && it.dataset.k === k) { const box = rng.closest('.en-more'); box.innerHTML = more(k); drawCharts(box); }
    else render();
    return;
  }
  if (cur) {
    curveOf = cur.dataset.curve;
    const box = cur.closest('.en-more'); box.innerHTML = more('curve'); drawCharts(box);
    return;
  }
  if (t.closest('#pumpPlus')) { pumpPlus = !pumpPlus; render(); return; }
  if (t.closest('#newsMore')) { newsAll = true; render(); return; }
  const row = t.closest('.en-row');
  if (!row) return;
  const k = row.closest('.en-item').dataset.k;
  if (open.has(k)) open.delete(k); else open.add(k);
  store.set('enOpen', [...open].slice(-40));
  render();
});
let resizeT;
addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => D && drawCharts($('#sec')), 150); });
addEventListener('hashchange', () => { const id = HASH[location.hash.slice(1)]; if (id && id !== sec) go(id); });

// ---- data ------------------------------------------------------------------------------------------------------------
async function load() {
  const st = $('#status');
  try {
    const r = await fetch(SRC, { cache: 'no-cache' });
    if (!r.ok) throw new Error(r.status);
    const next = await r.json();
    if (!D || next.updated !== lastUpdated) { D = next; lastUpdated = next.updated; render(); }
  } catch (e) {
    if (!D) $('#sec').innerHTML = '<p class="empty">Tallene kunne ikke hentes lige nu. Prøv igen om lidt.</p>';
  }
  if (D && D.updated) {
    const age = Date.now() - new Date(D.updated);
    st.textContent = age < 6e4 ? 'opdateret nu' : 'opdateret ' + clock(D.updated);
    st.classList.toggle('stale', age > 45 * 6e4);
    $('#dot').classList.toggle('stale', age > 45 * 6e4);
  } else st.textContent = 'ikke hentet';
}
$('#status').addEventListener('click', () => { $('#status').textContent = 'henter …'; load(); });
addEventListener('scroll', () => $('#bar').classList.toggle('scrolled', scrollY > 4), { passive: true });
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
setInterval(() => { if (!document.hidden) load(); }, 5 * 60e3);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('../sw.js').catch(() => {});
tabs();
foot();
load();
</script>
</body>
</html>
