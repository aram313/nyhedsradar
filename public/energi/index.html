<!doctype html>
<html lang="da">
<head>

<meta name="description" content="Benzin og diesel i Danmark, USA og Europa, olie og gas, aktier, frygtindekset, renten, dollaren, AI-giganterne, statsgæld og råvarer – opdateret hvert 5. minut, med hvad tallene betyder.">
<meta property="og:title" content="Økonomi – Khabar">
<meta property="og:description" content="Brændstof, olie, markeder, AI-boblen, gæld og råvarer – live, med hvad tallene betyder.">
<meta property="og:image" content="https://khabar.nu/icons/icon-512.png">
<meta name="theme-color" content="#eeeeeb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191919" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="../manifest.webmanifest">

<link rel="icon" href="../icons/icon-192.png">
<script>
  // the app's own tone and light/dark choice, before the first paint (no flash)
  try {
    const q = new URLSearchParams(location.search), d = document.documentElement;
    const get = (k, v) => q.get(k) || JSON.parse(localStorage.getItem(k) || JSON.stringify(v));
    const tone = get('tone', 'daempet'), mode = get('mode', 'auto'), dark = get('dark', 'notion');
    if (tone !== 'daempet') d.dataset.tone = tone;
    if (mode !== 'auto') d.dataset.theme = mode;
    if (dark !== 'notion') d.dataset.dark = dark;
    document.querySelector('meta[name="color-scheme"]').content = mode === 'light' ? 'light' : mode === 'dark' ? 'dark' : 'light dark';
    // the app's text size ('textSize'; 'size' before 17/10)
    const ts = JSON.parse(localStorage.getItem('textSize') || localStorage.getItem('size') || '"auto"');
    if (ts !== 'auto' && +ts) d.style.setProperty('--ts', ts);
  } catch (e) {}
  // ?embed=1: the app's Økonomi tab shows this page in a frame under its own bar. The page's bar and its way back go,
  // and it wears exactly the look the app wears now – the app's light or dark, tone, palette and text size (the app's
  // own setting, a ?theme= of its address, or the phone's text size), and again whenever the app changes it
  try {
    if (new URLSearchParams(location.search).get('embed') === '1' && parent !== window) {
      const d = document.documentElement, p = parent.document.documentElement;
      d.classList.add('embed');
      const follow = () => { try {
        for (const k of ['theme', 'tone', 'dark']) { if (p.dataset[k]) d.dataset[k] = p.dataset[k]; else delete d.dataset[k]; }
        const ts = p.style.getPropertyValue('--tsu').trim();
        if (+ts) d.style.setProperty('--ts', ts); else d.style.removeProperty('--ts');
        const m = p.dataset.theme;
        document.querySelector('meta[name="color-scheme"]').content = m === 'light' ? 'light' : m === 'dark' ? 'dark' : 'light dark';
      } catch (e) {} };
      follow();
      new MutationObserver(follow).observe(p, { attributes: true, attributeFilter: ['data-theme', 'data-tone', 'data-dark', 'style'] });
    }
  } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&text=%D8%AD%D8%A8%D8%B1&display=block" media="print" onload="this.media='all'">
<!-- the headline face, as on the app's front page (The Economist's manner): Source Serif 4, for the headline lines only -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400..700&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="../style.css">
<style>
  /* Økonomi: the app's look (its tokens, bar and story rows come from style.css). One long page of seven topics in a
     fixed order – Lige nu, Brændstof, Olie og gas, Markeder, AI, Gæld, Råvarer – and a dock at the bottom, in the
     thumb's reach, that follows the scroll. Each topic opens with generous space, a short red rule, a red fly title and
     one serif headline line in the manner of The Economist; then three or four figures as large tiles, one quiet
     'Flere tal' row with the rest, and one line with the topic's time and sources. Colour only for up/down next to an
     arrow, red only for the rule, the fly title and the dock's chosen topic */
  :root { --up: #2f7a52; --edock: calc(52px + var(--bottom)); --display: "Source Serif 4", "Source Serif Pro", Georgia, serif; }
  html { overflow-anchor: none; }   /* the page keeps its own place when something closes (anchored) and when the numbers are drawn anew (renderAll) */
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --up: #4cc38a; } }
  :root[data-theme="dark"] { --up: #4cc38a; }
  main.en { max-width: 680px; margin: 0 auto; padding: calc(var(--barh) + 2px) 0 calc(var(--edock) + 20px); font-size: var(--fs-body); }
  .bar > .brand { max-width: 680px; }
  .en-home { flex: none; display: flex; align-items: center; gap: 2px; min-height: 44px; margin-left: -10px; padding: 0 4px; color: var(--text); }
  .en-home > svg { width: 20px; height: 20px; color: var(--text-2); transform: scaleX(-1); }
  .en-home .logo { width: 38px; height: 28px; }
  .en-title { margin: 0 0 0 8px; font-size: calc(18px * var(--ts, 1)); font-weight: 720; letter-spacing: -.015em; }

  /* a topic: generous space above, a short red rule, the red fly title, the headline line in the serif */
  .ec-sec { padding-top: 52px; }
  .ec-sec:first-child { padding-top: 14px; }
  .ec-top { padding: 0 16px; }
  /* a topic tapped in the dock: its top lights up for a moment once the page is there (only opacity moves) */
  /* the whole topic's block (the owner, 18/10: 'det skal være hele blocken der lyser op'), from just above its rule to
     its foot, behind its tiles and rows */
  .ec-sec { position: relative; isolation: isolate; }
  .ec-sec::after { content: ""; position: absolute; z-index: -1; inset: 38px 4px -10px 4px; border-radius: 16px; background: var(--fill-2); opacity: 0; pointer-events: none; }
  .ec-sec:first-child::after { top: 2px; }
  .ec-sec.glow::after { animation: ecGlow 1.6s ease-out; }
  @keyframes ecGlow { 0% { opacity: 0; } 15% { opacity: 1; } 55% { opacity: 1; } 100% { opacity: 0; } }
  .ec-top::before { content: ""; display: block; width: 26px; height: 3px; margin-bottom: 11px; background: var(--red); }
  .ec-fly { display: block; margin: 0; font-size: var(--fs-cap); font-weight: 750; letter-spacing: .09em; text-transform: uppercase; color: var(--red); }
  /* 'Finans og økonomi': under its headline line – the newest story – that story's outlet and time, the way to it */
  .ec-lead-m { margin: 6px 16px 4px; font-size: var(--fs-meta); color: var(--text-3); }
  /* the very biggest economic news, at the top under Lige nu (bigNews) */
  .ec-big { display: grid; gap: 12px; margin: 12px 16px 10px; }
  .ec-bigi > a { display: block; padding: 1px 0 1px 12px; border-left: 3px solid var(--red); color: inherit; text-decoration: none; }
  .ec-bigi > a:active { opacity: .6; }
  .ec-big-k { display: block; font-size: var(--fs-cap); font-weight: 750; letter-spacing: .07em; text-transform: uppercase; color: var(--red); }
  .ec-big-h { display: block; margin-top: 3px; font-family: var(--display); font-size: var(--fs-lead); font-weight: 650; line-height: 1.22; }
  .ec-big-m { display: block; margin-top: 4px; font-size: var(--fs-meta); color: var(--text-3); }
  .ec-lead-m a { color: inherit; text-decoration: none; font-weight: 600; }
  /* one thing open, the rest dimmed (18/10): only opacity moves */
  .dimmed { opacity: .28; }
  body.fading .dimmed { transition: opacity .2s ease-out; }   /* only as it opens: what is drawn later is dim at once */
  @media (prefers-reduced-motion: reduce) { body.fading .dimmed { transition: none; } }
  /* 'Dagens citat' under 'Finans og økonomi': the statement large in the serif, who said it under it */
  .ec-quote { margin: 18px 16px 10px; padding: 14px 16px; border-radius: 16px; background: var(--fill); }
  .ec-q-h { margin: 0 0 6px; font-size: var(--fs-cap); font-weight: 750; letter-spacing: .07em; text-transform: uppercase; color: var(--text-3); }
  .ec-q { display: block; color: inherit; text-decoration: none; }
  .ec-q blockquote { margin: 0; font-family: var(--display); font-size: var(--fs-lead); line-height: 1.32; font-weight: 600; color: var(--text); text-wrap: pretty; }
  .ec-q figcaption { margin-top: 8px; font-size: var(--fs-meta); font-weight: 600; color: var(--text-2); }
  /* a story unfolded here: its original headline and the way to the outlet */
  .en-x { padding: 0 16px 12px; }
  .en-x.lead { padding-top: 2px; }
  .en-x.big, .en-x.quote { padding: 10px 0 2px 12px; }
  .en-x .acts { margin-top: 2px; }
  .en-orig { margin: 0 0 8px; font-size: var(--fs-small); line-height: 1.4; color: var(--text-2); }
  .en-go { display: inline-flex; align-items: center; min-height: 40px; padding: 0 14px; border-radius: 999px; background: var(--fill); color: var(--text); font-size: var(--fs-small); font-weight: 650; text-decoration: none; }
  /* pulled down to refresh (18/10, the owner: 'man kan ikke hive ned for at opdatere økonomi siden') */
  main.en.pulling { will-change: transform; }
  main.en.settling { transition: transform .38s cubic-bezier(.16, 1, .3, 1); }
  .ec-head { margin: 6px 0 0; font-family: var(--display); font-size: var(--fs-title); font-weight: 700; line-height: 1.14; letter-spacing: -.012em;
    font-variation-settings: "opsz" 60; text-wrap: balance; }
  .ec-meta { margin: 10px 16px 0; font-size: var(--fs-meta); line-height: 1.45; color: var(--text-3); text-wrap: pretty; }
  .ec-sub { margin: 20px 16px 4px; font-size: var(--fs-cap); font-weight: 750; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); }
  .en-hint { margin: 0 16px 4px; font-size: var(--fs-meta); line-height: 1.45; color: var(--text-3); }

  /* the key figures: large, simple tiles (12 from the edge, 12 inside, radius 16 – the app's panel); a tap opens the
     figure's chart and what it means under its row */
  .ec-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 16px 12px 0; }
  .ec-tile { display: flex; flex-direction: column; align-items: stretch; min-width: 0; width: 100%; padding: 12px 12px 10px; border-radius: var(--r-panel);
    background: var(--fill); color: var(--text); text-align: left; }
  .ec-tile:active { background: var(--fill-2); }
  .ec-tile[aria-expanded="true"] { box-shadow: inset 0 0 0 1.5px var(--text-3); }
  .ec-span { grid-column: 1 / -1; }
  .ec-k { display: block; font-size: var(--fs-meta); font-weight: 650; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ec-v { display: block; margin-top: 4px; font-size: min(calc(30px * var(--ts, 1)), 7.4vw); font-weight: 720; line-height: 1.05; letter-spacing: -.02em;
    font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ec-v small { margin-left: 4px; font-size: var(--fs-meta); font-weight: 600; letter-spacing: 0; color: var(--text-3); }
  .ec-m { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-top: 6px; min-width: 0; }
  .ec-m .en-c { margin: 0; white-space: nowrap; }
  .ec-t { min-width: 0; font-size: var(--fs-meta); color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  svg.ec-sp { display: block; width: 100%; height: 22px; margin-top: 8px; overflow: visible; }
  .ec-sp path { fill: none; stroke: var(--text-3); stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
  .ec-l { display: block; margin-top: 6px; font-size: var(--fs-meta); line-height: 1.4; color: var(--text-3); }
  .ec-l b { color: var(--text-2); font-weight: 650; }
  .ec-share { display: flex; height: 6px; margin-top: 8px; border-radius: 3px; overflow: hidden; background: var(--fill-2); }
  .ec-share i { display: block; background: var(--text-2); }
  .ec-open { grid-column: 1 / -1; min-width: 0; padding: 4px 12px 14px; border-radius: var(--r-panel); background: var(--fill); }
  .ec-open .en-range button[aria-pressed="true"] span { background: var(--bg); }

  /* Lige nu: the biggest moves across the topics, each a way to its topic */
  .ec-mv { display: grid; grid-template-columns: minmax(0, 1fr) auto 16px; align-items: center; gap: 10px; width: 100%;
    min-height: calc(58px * var(--ts, 1)); padding: 8px 12px 8px 16px; text-align: left; }
  .ec-mv:active { background-color: var(--fill); }
  .ec-mv .en-name small { white-space: normal; }
  .ec-chev { width: 16px; height: 16px; color: var(--text-3); }

  /* 'Flere tal': one quiet row per topic; the rest of the figures unfold in place */
  .ec-fold { display: flex; align-items: center; gap: 4px; width: calc(100% - 32px); min-height: 48px; margin: 12px 16px 0; padding: 0;
    border-top: 1px solid var(--line); font-size: var(--fs-small); font-weight: 600; color: var(--text-2); text-align: left; }
  .ec-fold svg { width: 15px; height: 15px; transition: transform .2s var(--ease); }
  .ec-fold[aria-expanded="true"] svg { transform: rotate(90deg); }
  .ec-folded { padding-bottom: 4px; }

  /* one figure in the fold: name and unit at the left, three months in a small line, value and day's move at the right */
  .en-item { position: relative; }
  .en-item + .en-item::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: 1px solid var(--line); }
  .en-item.open { background-color: var(--fill); }
  .en-item.open::before, .en-item.open + .en-item::before { opacity: 0; }
  .en-row { display: grid; grid-template-columns: minmax(0, 1fr) 64px 96px; align-items: center; gap: 12px; width: 100%;
    min-height: calc(58px * var(--ts, 1)); padding: 8px 16px; text-align: left; }
  .en-row:active { background-color: var(--fill); }
  .en-name { min-width: 0; }
  .en-name b { display: block; font-size: var(--fs-body); font-weight: 650; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .en-name small { display: block; margin-top: 2px; font-size: var(--fs-meta); color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  svg.en-spark { width: 64px; height: 26px; overflow: visible; }
  .en-spark path { fill: none; stroke: var(--text-2); stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
  .en-spark circle { fill: var(--text); }
  .en-val { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .en-v { display: block; font-size: calc(17px * var(--ts, 1)); font-weight: 650; letter-spacing: -.01em; }
  .en-c { display: block; margin-top: 2px; font-size: var(--fs-meta); font-weight: 600; color: var(--text-3); }
  .en-c.up { color: var(--up); }
  .en-c.down { color: var(--pulse); }

  /* opened: a chart you can touch, its ranges, and what the number means */
  .en-more { padding: 0 16px 16px; }
  .en-range { display: flex; flex-wrap: wrap; gap: 2px; margin: -2px 0 2px -6px; }
  .en-range button { min-height: 44px; padding: 0 4px; display: grid; place-items: center; }
  .en-range span { padding: 5px 11px; border-radius: 14px; font-size: var(--fs-meta); font-weight: 650; color: var(--text-2); }
  .en-range button[aria-pressed="true"] span { background: var(--fill-2); color: var(--text); }
  .en-item.open .en-range button[aria-pressed="true"] span { background: var(--bg); }
  .en-chart { position: relative; height: 172px; touch-action: pan-y; -webkit-user-select: none; user-select: none; }
  .en-chart svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .en-chart .grid { stroke: var(--line); stroke-width: 1; }
  .en-chart .zero { stroke: var(--text-3); stroke-width: 1; stroke-dasharray: 3 3; }
  .en-chart .ln { fill: none; stroke: var(--text); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .en-chart .ln.two { stroke: var(--text-3); stroke-dasharray: 5 4; }
  .en-chart .ln.red { stroke: var(--red); }
  .en-chart .pt { fill: var(--text); stroke: var(--fill); stroke-width: 2; }
  .en-chart .lbl { fill: var(--text-3); font-size: 11px; font-variant-numeric: tabular-nums; }
  .en-chart .tag { fill: var(--text-2); font-size: 11.5px; font-weight: 650; }
  .en-chart .cross { stroke: var(--text-3); stroke-width: 1; }
  .en-tip { position: absolute; top: -4px; transform: translate(-50%, -100%); padding: 3px 8px; border-radius: 8px; background: var(--text); color: var(--bg);
    font-size: var(--fs-meta); font-weight: 650; white-space: nowrap; pointer-events: none; font-variant-numeric: tabular-nums; }
  .en-hl { margin: 8px 0 0; font-size: var(--fs-meta); line-height: 1.45; color: var(--text-2); font-variant-numeric: tabular-nums; }
  .en-src { margin: 10px 0 0; font-size: var(--fs-meta); color: var(--text-3); }
  .en-seg { display: inline-flex; gap: 2px; margin: 0 0 2px -6px; }
  .ec-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 6px 0 0; font-size: var(--fs-meta); color: var(--text-2); }
  .ec-legend i { display: inline-block; width: 16px; height: 0; margin-right: 6px; vertical-align: 3px; border-top: 2px solid var(--text); }
  .ec-legend i.two { border-top: 2px dashed var(--text-3); }
  .ec-legend i.red { border-top-color: var(--red); }
  .ec-pad { padding: 0 16px; }

  /* what it is, why to watch it now, what a rise and a fall mean */
  .ec-ex { margin: 12px 0 0; }
  .ec-ex dt { margin-top: 10px; font-size: var(--fs-meta); font-weight: 700; color: var(--text); }
  .ec-ex dd { margin: 2px 0 0; font-size: var(--fs-small); line-height: 1.45; color: var(--text-2); text-wrap: pretty; }
  .ec-ud { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .ec-ud dt .a { margin-right: 4px; font-size: .85em; }
  .ec-ud .up .a { color: var(--up); }
  .ec-ud .down .a { color: var(--pulse); }

  /* Danish pump prices: one line per chain, the cheapest in bold */
  .en-pump { width: calc(100% - 32px); margin: 0 16px; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  .en-pump th { padding: 6px 0; font-size: var(--fs-cap); font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--text-3); text-align: right; }
  .en-pump th:first-child { text-align: left; }
  .en-pump th + th, .en-pump td + td { padding-left: 12px; white-space: nowrap; }
  .en-pump td { padding: 9px 0; border-top: 1px solid var(--line); font-size: var(--fs-body); text-align: right; color: var(--text-2); }
  .en-pump td:first-child { text-align: left; color: var(--text); }
  .en-pump td:first-child b { font-weight: 650; }
  .en-pump td small { display: block; margin-top: 1px; font-size: var(--fs-meta); color: var(--text-3); }
  .en-pump td.low { color: var(--text); font-weight: 700; }
  .en-pump tr.me td { color: var(--text); font-weight: 700; }
  .en-pump tr.avg td { font-style: italic; }
  .en-pump + .en-pump { margin-top: 14px; }
  .en-note { margin: 8px 16px 0; font-size: var(--fs-meta); line-height: 1.45; color: var(--text-3); }
  .en-note b { color: var(--text-2); font-weight: 650; }
  .ec-open .en-note { margin: 8px 0 0; }

  /* the US debt counter: an estimate between the Treasury's daily figures, and it says so */
  .ec-debt .ec-k { display: flex; justify-content: space-between; gap: 8px; }
  .ec-est { font-weight: 700; color: var(--red); letter-spacing: .04em; text-transform: uppercase; font-size: var(--fs-cap); }
  .ec-count { display: block; margin-top: 6px; font-size: min(var(--fs-title), 7.2vw); font-weight: 720; letter-spacing: -.02em; font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* debt in % of GDP: one bar per land, sorted, a tap opens its years */
  .ec-bar { display: grid; grid-template-columns: 108px minmax(0, 1fr) 62px; align-items: center; gap: 10px; width: 100%; min-height: 44px; padding: 4px 16px; text-align: left; }
  .ec-bar:active { background-color: var(--fill); }
  .ec-bar b { font-size: var(--fs-small); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ec-bar .tr { height: 10px; border-radius: 2px; background: var(--fill); overflow: hidden; }
  .ec-bar .tr i { display: block; height: 100%; background: var(--text-3); }
  .ec-bar.me .tr i { background: var(--text); }
  .ec-bar .n { text-align: right; font-size: var(--fs-small); font-weight: 650; font-variant-numeric: tabular-nums; }
  .en-item.bar-item + .en-item.bar-item::before { display: none; }
  .en-item.open .ec-bar .tr { background: var(--bg); }

  /* the bubble: a few plain points */
  .ec-pts { margin: 4px 16px 0; padding: 0; list-style: none; }
  .ec-pts li { padding: 10px 0; font-size: var(--fs-small); line-height: 1.48; color: var(--text-2); }
  .ec-pts li + li { border-top: 1px solid var(--line); }
  .ec-pts b { color: var(--text); font-weight: 700; }

  .en-news .row { text-align: left; }
  .en-news .story .row { height: auto; min-height: calc(64px * var(--ts, 1)); padding-top: 10px; padding-bottom: 10px; }   /* a row grows with its headline */
  .en-showmore { display: flex; align-items: center; gap: 2px; min-height: 44px; margin-left: 16px; font-size: var(--fs-small); font-weight: 600; color: var(--text-2); }
  .en-showmore svg { width: 15px; height: 15px; transform: rotate(90deg); }
  main.en > .foot { margin-top: 40px; }
  .ec-advice { margin: 18px 16px 0; padding-top: 12px; border-top: 1px solid var(--line); font-size: var(--fs-meta); line-height: 1.5; color: var(--text-3); text-align: center; }

  /* the dock: the seven topics in the thumb's reach; the one in view has a short red rule over it (solid, no blur). It
     follows the scroll; a tap jumps to the topic. One weight for all, so nothing shifts while it follows */

// ---- Lige nu: the biggest moves across the topics, from the numbers --------------------------------------------------
const MOVERS = ['spx', 'ndx', 'sx5e', 'c25', 'n225', 'sse', 'vix', 'tnx', 'dxy', 'gold', 'copper', 'wheat', 'btc', 'brent', 'ttf', 'ulsd', ...AI];
const median = a => { const s = [...a].sort((x, y) => x - y); return s.length ? s[Math.floor(s.length / 2)] : 0; };
// each move against the figure's typical day (the median of the last three months' daily moves)
function movers() {
  const out = [];
  for (const k of MOVERS) {
    const x = D.s[k];
    if (!x || x.p == null || !x.h || x.h.length < 30 || Date.now() - asDate(x.t) > 4 * 864e5) continue;
    const rate = C[k].kind === 'pp';
    const ch = rate ? x.v - x.p : pct(x);
    const days = [];
    for (let i = Math.max(1, x.h.length - 66); i < x.h.length; i++) days.push(Math.abs(rate ? x.h[i][1] - x.h[i - 1][1] : (x.h[i][1] - x.h[i - 1][1]) / x.h[i - 1][1] * 100));
    const typ = median(days);
    if (ch == null || !typ || Math.abs(ch) < 1e-9) continue;
    out.push({ k, ch, typ, z: Math.abs(ch) / typ });
  }
  return out.sort((a, b) => b.z - a.z);
}
// the four biggest, at most two from one topic
function topMoves() {
  const out = [], per = {};
  for (const m of movers()) {
    const t = HOME[m.k];
    if ((per[t] = (per[t] || 0) + 1) > 2) continue;
    out.push(m);
    if (out.length === 4) break;
  }
  return out;
}
const moveFig = m => ({ k: m.k, tc: tclass(m.k, D.s[m.k]), tt: D.s[m.k].t });
function nowRows(list, base) {
  if (!list.length) return WAIT;
  return '<div class="ec-mvs" style="margin-top:12px">' + list.map(m => {
    const c = C[m.k], x = D.s[m.k], rate = c.kind === 'pp', mv = move(m.k, x);
    const typ = rate ? nf(m.typ, 2) + ' point' : nf(m.typ, 1) + ' %';
    const own = tclass(m.k, x) !== base.tc ? stamp(m.k, x) : '';
    const note = [TOPIC[HOME[m.k]].tab, own, `${m.z >= 2.5 ? 'usædvanligt – ' : ''}typisk ${typ} på en dag`].filter(Boolean).join(' · ');
    return `<div class="en-item"><button class="ec-mv" data-go="${m.k}"><span class="en-name"><b>${esc(c.n)}</b><small>${esc(note)}</small></span>`
      + `<span class="en-val"><span class="en-v">${esc(fmtv(m.k, x.v))}</span><span class="en-c ${mv.cls}">${esc(mv.text)}</span></span><span class="ec-chev">${CHEV}</span></button></div>`;
  }).join('') + '</div>';
}

  let pull = null;
  const app = name => { try { return EMBED && typeof parent[name] === 'function' ? parent[name] : null; } catch (e) { return null; } };
  const reset = () => { page.classList.remove('pulling'); page.style.transform = ''; const r = app('khabarOkReady'); if (r) r(false); };
  addEventListener('touchstart', e => { if (scrollY <= 0) pull = { x: e.touches[0].clientX, y: e.touches[0].clientY, d: 0 }; }, { passive: true });
  addEventListener('touchmove', e => {
    if (!pull) return;
    const dx = e.touches[0].clientX - pull.x;
    pull.d = e.touches[0].clientY - pull.y;
    if (!pull.lock && Math.hypot(dx, pull.d) > 10) pull.lock = Math.abs(pull.d) > Math.abs(dx) ? 'y' : 'x';
    if (pull.lock === 'x') { pull = null; reset(); return; }
    if (pull.lock !== 'y') return;
    if (pull.d <= 0 || scrollY > 0) { page.style.transform = ''; return; }
    page.classList.add('pulling');
    page.style.transform = `translateY(${(110 * (1 - Math.exp(-pull.d / 170))).toFixed(1)}px)`;
    const r = app('khabarOkReady'); if (r) r(pull.d >= PULL);
  }, { passive: true });
  addEventListener('touchcancel', () => { if (pull) { pull = null; reset(); } });
  addEventListener('touchend', async () => {
    if (!pull) return;
    const go = pull.lock === 'y' && pull.d >= PULL;
    pull = null;
    page.classList.remove('pulling');
    page.classList.add('settling');
    const r = app('khabarOkReady'); if (r) r(false);
    if (go) {
      page.style.transform = 'translateY(48px)';
      $('#status').textContent = 'henter …';
      const signal = app('khabarOkRefresh');
      if (signal) await signal(() => load()); else await load();
    }
    page.style.transform = '';
    setTimeout(() => page.classList.remove('settling'), 420);
  });
}
addEventListener('scroll', () => $('#bar').classList.toggle('scrolled', scrollY > 4), { passive: true });
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
setInterval(() => { if (!document.hidden) load(); }, 5 * 60e3);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('../sw.js').catch(() => {});
// the seven topics' places (Lige nu's head and a skeleton until the numbers come; the others then)
$('#topics').innerHTML = TOPICS.map(T => `<section class="ec-sec" id="s-${T.h}" data-t="${T.id}" aria-labelledby="f-${T.id}">${T.id === 'nu' ? `<header class="ec-top"><p class="ec-fly" id="f-${T.id}">${esc(T.fly)}</p></header><div class="block"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>` : ''}</section>`).join('');
dock();
watch();
foot();
load();
</script>
