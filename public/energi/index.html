<script>
  // the app's own tone and light/dark choice, before the first paint (no flash)
  try {
    const q = new URLSearchParams(location.search), d = document.documentElement;
    const get = (k, v) => q.get(k) || JSON.parse(localStorage.getItem(k) || JSON.stringify(v));
    const tone = get('tone', 'daempet'), mode = get('mode', 'auto'), dark = get('dark', 'notion');
    if (tone !== 'daempet') d.dataset.tone = tone;
    if (mode !== 'auto') d.dataset.theme = mode;
    if (dark !== 'notion') d.dataset.dark = dark;
    document.querySelector('meta[name="color-scheme"]').content = mode === 'light' ? 'light' : mode === 'dark' ? 'dark' : 'light dark';
    // the app's text size ('textSize'; 'size' before 17/10)
    const ts = JSON.parse(localStorage.getItem('textSize') || localStorage.getItem('size') || '"auto"');
    if (ts !== 'auto' && +ts) d.style.setProperty('--ts', ts);
  } catch (e) {}
  // ?embed=1: the app's Kort tab shows this page in a frame under its own bar (its Priser view). The page's bar and its
  // way back go, and it wears exactly the look the app wears now – the app's light or dark, tone, palette and text size
  // (the app's own setting, a ?theme= of its address, or the phone's text size), and again whenever the app changes it
  try {
    if (new URLSearchParams(location.search).get('embed') === '1' && parent !== window) {
      const d = document.documentElement, p = parent.document.documentElement;
      d.classList.add('embed');
      const follow = () => { try {
        for (const k of ['theme', 'tone', 'dark']) { if (p.dataset[k]) d.dataset[k] = p.dataset[k]; else delete d.dataset[k]; }
        const ts = p.style.getPropertyValue('--tsu').trim();
        if (+ts) d.style.setProperty('--ts', ts); else d.style.removeProperty('--ts');
        const m = p.dataset.theme;
        document.querySelector('meta[name="color-scheme"]').content = m === 'light' ? 'light' : m === 'dark' ? 'dark' : 'light dark';
      } catch (e) {} };
      follow();
      new MutationObserver(follow).observe(p, { attributes: true, attributeFilter: ['data-theme', 'data-tone', 'data-dark', 'style'] });
    }
  } catch (e) {}

  /* inside the app's Kort tab (?embed=1): no bar and no way back of its own – the app's bar is above it; a sideways

<script>

    what: 'Olie handles i dollar, så en stærkere dollar gør brændstof dyrere i Danmark, selv når olien står stille.' },

};
const BLOCKS = [

];
const PUMP = { benzin: 'Benzin 95', diesel: 'Diesel', benzin_plus: 'Benzin', diesel_plus: 'Diesel', hvo: 'HVO100' };

let D = null;
const open = new Set(store.get('enOpen', []));
const range = store.get('enRange', {});
let curveOf = 'brent', pumpPlus = false, newsAll = false;

// ---- numbers and time ----------------------------------------------------------------------------------------------
const nf = (v, d = 2) => Number(v).toLocaleString('da-DK', { minimumFractionDigits: d, maximumFractionDigits: d });
const signed = (v, d = 2) => (v > 0 ? '+' : v < 0 ? '−' : '') + nf(Math.abs(v), d);
const isDay = t => /^\d{4}-\d{2}-\d{2}$/.test(t);
const asDate = t => isDay(t) ? new Date(t + 'T12:00:00') : new Date(t);
const dayLabel = (t, opts = { day: 'numeric', month: 'short' }) => asDate(t).toLocaleDateString('da-DK', opts);
const clock = t => new Date(t).toLocaleTimeString('da-DK', { hour: '2-digit', minute: '2-digit' });
const sameDay = (a, b) => a.toDateString() === b.toDateString();
function when(t) {
  if (!t) return '';
  const d = asDate(t), now = new Date();
  if (isDay(t)) return sameDay(d, now) ? 'i dag' : dayLabel(t);
  if (sameDay(d, now)) return 'kl. ' + clock(t);
  const y = new Date(now); y.setDate(now.getDate() - 1);
  if (sameDay(d, y)) return 'i går ' + clock(t);
  if (now - d < 6 * 864e5) return d.toLocaleDateString('da-DK', { weekday: 'long' }) + ' ' + clock(t);
  return dayLabel(t);
}
const monthName = ym => new Date(ym + '-15T12:00:00').toLocaleDateString('da-DK', { month: 'short', year: '2-digit' }).replace('.', '');

// the day's move: % for prices, $ for spreads; an arrow, so colour is never the only sign
function move(k, x) {
  if (x.p == null || x.v == null) return { cls: '', text: '' };
  const diff = x.v - x.p;
  if (Math.abs(diff) < 1e-9) return { cls: '', text: 'uændret' };
  const cls = diff > 0 ? 'up' : 'down', arrow = diff > 0 ? '▲' : '▼';
  if (C[k] && C[k].spread) return { cls, text: `${arrow} ${nf(Math.abs(diff), C[k].d)}` };
  const pc = Math.abs(diff / x.p * 100);
  return { cls, text: `${arrow} ${nf(pc, pc < .1 ? 2 : 1)} %` };
}

// ---- small and large charts ----------------------------------------------------------------------------------------
function sparkPath(vals, w, h) {
  const lo = Math.min(...vals), hi = Math.max(...vals), span = hi - lo || 1;
  const pts = vals.map((v, i) => [vals.length < 2 ? w : i / (vals.length - 1) * w, h - 2 - (v - lo) / span * (h - 4)]);
  return { d: 'M' + pts.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('L'), end: pts[pts.length - 1] };
}
function spark(vals) {
  if (!vals || vals.length < 2) return '<svg class="en-spark" aria-hidden="true"></svg>';
  const { d, end } = sparkPath(vals, 64, 26);
  return `<svg class="en-spark" viewBox="0 0 64 26" aria-hidden="true"><path d="${d}"/><circle cx="${end[0].toFixed(1)}" cy="${end[1].toFixed(1)}" r="2.4"/></svg>`;
}
function ticks(lo, hi, n = 4) {
  const span = hi - lo || Math.abs(hi) || 1, raw = span / n, mag = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw) || 10 * mag;
  const out = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi + step * 1e-6; v += step) out.push(+v.toFixed(10));
  return { out, step };
}
// a line chart you can touch: series = [{ pts: [[label, value], ...], cls }]; x is the point's place in the list
function chart(box, series, { d = 2, fmt, dots = false, tags = [] } = {}) {
  const W = box.clientWidth || 320, H = box.clientHeight || 172, R = 46, T = 10, B = 22;
  const all = series.flatMap(s => s.pts.map(p => p[1]));
  if (!all.length) { box.innerHTML = ''; return; }
  let lo = Math.min(...all), hi = Math.max(...all);
  const pad = (hi - lo) * .08 || Math.abs(hi) * .02 || 1;
  lo -= pad; hi += pad;
  const tk = ticks(lo, hi, 4);
  const n = Math.max(...series.map(s => s.pts.length));
  const X = i => n < 2 ? (W - R) / 2 : i / (n - 1) * (W - R - 4) + 2;
  const Y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  const show = fmt || (v => nf(v, d));
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Graf">`;
  for (const v of tk.out) if (v >= lo && v <= hi)
    svg += `<line class="grid" x1="0" x2="${W - R + 6}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/><text class="lbl" x="${W}" y="${(Y(v) + 4).toFixed(1)}" text-anchor="end">${esc(nf(v, tk.step < 1 ? (tk.step < .1 ? 2 : 1) : 0))}</text>`;
  if (lo < 0 && hi > 0) svg += `<line class="zero" x1="0" x2="${W - R + 6}" y1="${Y(0).toFixed(1)}" y2="${Y(0).toFixed(1)}"/>`;
  const first = series[0].pts, labels = [0, Math.floor((first.length - 1) / 2), first.length - 1].filter((v, i, a) => a.indexOf(v) === i);
  for (const i of labels) svg += `<text class="lbl" x="${X(i).toFixed(1)}" y="${H - 5}" text-anchor="${i === 0 ? 'start' : i === first.length - 1 ? 'end' : 'middle'}">${esc(first[i][2] || first[i][0])}</text>`;
  for (const s of series) {
    if (s.pts.length > 1) svg += `<path class="ln ${s.cls || ''}" d="M${s.pts.map((p, i) => X(i).toFixed(1) + ' ' + Y(p[1]).toFixed(1)).join('L')}"/>`;
    if (dots || s.pts.length === 1) svg += s.pts.map((p, i) => `<circle class="pt" cx="${X(i).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="3.5"/>`).join('');
  }
  for (const t of tags) svg += `<text class="tag" x="${X(t.i).toFixed(1)}" y="${(Y(t.v) + t.dy).toFixed(1)}" text-anchor="${t.anchor || 'end'}">${esc(t.text)}</text>`;
  svg += `<line class="cross" id="x" x1="0" x2="0" y1="${T}" y2="${H - B}" visibility="hidden"/>` + series.map((s, j) => `<circle class="pt" data-j="${j}" r="4" visibility="hidden"/>`).join('') + '</svg>';
  box.innerHTML = svg + '<div class="en-tip" hidden></div>';
  const tip = box.querySelector('.en-tip'), cross = box.querySelector('#x'), marks = box.querySelectorAll('circle[data-j]');
  const at = ev => {
    const r = box.getBoundingClientRect(), x = (ev.clientX - r.left) / r.width * W;
    const i = Math.max(0, Math.min(n - 1, Math.round(n < 2 ? 0 : (x - 2) / (W - R - 4) * (n - 1))));
    cross.setAttribute('x1', X(i)); cross.setAttribute('x2', X(i)); cross.setAttribute('visibility', 'visible');
    const parts = [];
    marks.forEach((m, j) => {
      const p = series[j].pts[i];
      if (!p) { m.setAttribute('visibility', 'hidden'); return; }
      m.setAttribute('cx', X(i)); m.setAttribute('cy', Y(p[1])); m.setAttribute('visibility', 'visible');
      parts.push((series[j].name ? series[j].name + ' ' : '') + show(p[1]));
    });
    const p0 = (series.find(s => s.pts[i]) || series[0]).pts[i];
    tip.textContent = `${p0[3] || p0[2] || p0[0]} · ${parts.join(' · ')}`;
    tip.hidden = false;
    const half = tip.offsetWidth / 2 / r.width * W;
    tip.style.left = Math.max(half, Math.min(W - half, X(i))) / W * 100 + '%';
  };
  box.onpointerdown = box.onpointermove = ev => at(ev);
  box.onpointerleave = ev => { if (ev.pointerType === 'mouse') { tip.hidden = true; cross.setAttribute('visibility', 'hidden'); marks.forEach(m => m.setAttribute('visibility', 'hidden')); } };
}
const dated = h => h.map(([t, v]) => [t, v, dayLabel(t), dayLabel(t, { day: 'numeric', month: 'short', year: 'numeric' })]);

// ---- the page ------------------------------------------------------------------------------------------------------
function curveSpread(c) {
  if (!c || c.length < 2) return null;
  const a = c[0], z = c[Math.min(6, c.length - 1)];
  return { a, z, v: a[1] - z[1] };
}
function rowFor(k) {
  const c = C[k];
  let x = D.s[k];
  if (k === 'curve') {
    const cs = curveSpread(D.curve && D.curve.brent);
    if (!cs) return '';
    x = { v: cs.v, p: null, h: [], t: D.ok && D.ok.curve };
    const m = cs.v > 0 ? 'backwardation' : 'contango';
    return item(k, `Brent ${monthName(cs.a[0])} − ${monthName(cs.z[0])}`, spark(D.curve.brent.map(p => p[1])), signed(cs.v, 2), { cls: '', text: m });
  }
  if (!x || x.v == null) return '';
  const h = (x.h || []).slice(-66).map(p => p[1]);
  const mv = move(k, x);
  const old = x.t && ((Date.now() - asDate(x.t)) > 4 * 864e5 || (!isDay(x.t) && newest() - asDate(x.t) > 30 * 36e5));
  return item(k, c.s, spark(h), c.spread ? signed(x.v, c.d) : nf(x.v, c.d), old ? { cls: 'old', text: when(x.t) } : mv);
}
function item(k, sub, sp, val, mv) {
  const isOpen = open.has(k);
  return `<div class="en-item${isOpen ? ' open' : ''}" data-k="${k}">
    <button class="en-row" aria-expanded="${isOpen}"><span class="en-name"><b>${esc(C[k].n)}</b><small>${esc(sub)}</small></span>${sp}
    <span class="en-val"><span class="en-v">${esc(val)}</span><span class="en-c ${mv.cls}">${esc(mv.text)}</span></span></button>
    ${isOpen ? `<div class="en-more">${more(k)}</div>` : ''}</div>`;
}
const RANGES = [['1m', '1 md.', 22], ['3m', '3 mdr.', 66], ['6m', '6 mdr.', 999]];
function more(k) {
  const c = C[k];
  if (k === 'curve') {
    const segs = ['brent', 'wti'].filter(q => D.curve && D.curve[q]).map(q => `<button data-curve="${q}" aria-pressed="${q === curveOf}"><span>${q === 'brent' ? 'Brent' : 'WTI'}</span></button>`).join('');
    const cs = curveSpread(D.curve[curveOf]);
    const hl = cs ? `${monthName(cs.a[0])}: <b>${nf(cs.a[1], 2)} $</b> · ${monthName(cs.z[0])}: <b>${nf(cs.z[1], 2)} $</b> · ${cs.v > 0 ? 'backwardation' : 'contango'} ${nf(Math.abs(cs.v), 2)} $` : '';
    return `<div class="en-range en-seg">${segs}</div><div class="en-chart" data-chart="curve"></div><p class="en-hl">${hl}</p><p class="en-what">${esc(c.what)}</p><p class="en-src">${esc(c.src)} · ${esc(when(D.ok && D.ok.curve))}</p>`;
  }
  const x = D.s[k], r = range[k] || '3m';
  const pts = (x.h || []).slice(-(RANGES.find(q => q[0] === r) || RANGES[1])[2]);
  const vals = pts.map(p => p[1]);
  const f = v => c.spread ? signed(v, c.d) : nf(v, c.d);
  const hl = vals.length ? `Høj ${f(Math.max(...vals))} · lav ${f(Math.min(...vals))} · snit ${f(vals.reduce((a, b) => a + b, 0) / vals.length)}` : '';
  const btns = RANGES.map(([id, label]) => `<button data-range="${id}" aria-pressed="${id === r}"><span>${label}</span></button>`).join('');
  return `<div class="en-range">${btns}</div><div class="en-chart" data-chart="${k}"></div><p class="en-hl">${hl}</p><p class="en-what">${esc(c.what)}</p><p class="en-src">${esc(c.src)} · seneste ${esc(when(x.t))}</p>`;
}
function drawCharts(root = document) {
  root.querySelectorAll('.en-chart[data-chart]').forEach(box => {
    const k = box.dataset.chart;
    if (k === 'curve') {
      const c = D.curve[curveOf] || [];
      const cs = curveSpread(c);
      const pts = c.map(([m, v]) => [m, v, monthName(m), monthName(m)]);
      return chart(box, [{ pts }], { d: 2, dots: true, fmt: v => nf(v, 2) + ' $' });
    }
    if (k === 'pumps') return pumpChart(box);
    const x = D.s[k], r = range[k] || '3m';
    const pts = dated((x.h || []).slice(-(RANGES.find(q => q[0] === r) || RANGES[1])[2]));
    chart(box, [{ pts }], { d: C[k].d, fmt: v => C[k].spread ? signed(v, C[k].d) : nf(v, C[k].d) });
  });
}

// the newest price time among the futures: what 'now' is for the markets (a price a trading day older is shown as old)
const newest = () => Math.max(0, ...['brent', 'wti', 'rbob', 'ulsd'].map(k => D.s[k] && D.s[k].t ? +asDate(D.s[k].t) : 0));
// the exchanges close from Friday night to Sunday night (ICE and NYMEX: Saturday 00 to Monday 00 Danish time)
function closedNow() {
  const n = new Date(), wd = n.getDay(), last = newest();
  return (wd === 6 || wd === 0) && last && Date.now() - last > 2 * 36e5;
}
// Lige nu: the few lines that say where the market stands
function signals() {
  const s = D.s, out = [];
  if (closedNow()) out.push(`<b>Børserne holder weekend:</b> olie og gas står med fredagens lukkekurser <span class="q">åbner igen natten til mandag</span>`);
  const pct = x => x && x.p ? (x.v - x.p) / x.p * 100 : null;
  const b = s.brent;
  if (b) {
    const p = pct(b);
    const mv = p == null ? '' : Math.abs(p) < .05 ? 'uændret' : `${p > 0 ? 'op' : 'ned'} ${nf(Math.abs(p), 1)} %`;
    out.push(`<b>Brent:</b> ${nf(b.v, 2)} $ pr. tønde${mv ? ' – ' + mv + (closedNow() ? ' fredag' : '') : ''} <span class="q">${esc(closedNow() ? 'lukkekurs' : when(b.t))}</span>`);
  }
  const pp = s.phys_prem;
  if (pp && Math.abs(pp.v) >= .5) {
    const what = pp.v > 3 ? 'rigtige laster er knappe' : pp.v < -3 ? 'rigeligt med olie på vandet' : 'tæt på normalt';
    out.push(`<b>Fysisk olie:</b> ${nf(Math.abs(pp.v), 2)} $ ${pp.v > 0 ? 'over' : 'under'} papirprisen – ${what} <span class="q">${esc(when(pp.t))}</span>`);
  }
  const cs = curveSpread(D.curve && D.curve.brent);
  if (cs) out.push(`<b>Terminskurven:</b> ${esc(monthName(cs.a[0]))} koster ${nf(Math.abs(cs.v), 2)} $ ${cs.v > 0 ? 'mere' : 'mindre'} end ${esc(monthName(cs.z[0]))} – ${cs.v > 0 ? 'markedet betaler for olie nu' : 'der er olie nok nu'}`);
  const dc = s.crack_diesel;
  if (dc && dc.h && dc.h.length > 20) {
    const vals = dc.h.map(p => p[1]), avg = vals.reduce((a, b) => a + b, 0) / vals.length;
    const rel = dc.v >= Math.max(...vals) ? 'højeste i et halvt år' : dc.v <= Math.min(...vals) ? 'laveste i et halvt år' : `${dc.v > avg ? 'over' : 'under'} halvårets snit på ${nf(avg, 0)} $`;
    out.push(`<b>Diesel-margin:</b> ${nf(dc.v, 2)} $ pr. tønde over Brent – ${rel}`);
  }
  const low = lowest();
  if (low.benzin) out.push(`<b>Pumpen:</b> benzin ${nf(low.benzin.v, 2)} kr.${low.diesel ? ` · diesel ${nf(low.diesel.v, 2)} kr.` : ''} pr. liter <span class="q">billigste kæde</span>`);
  return out;
}
function lowest() {
  const out = {};
  for (const c of (D.pumps && D.pumps.chains) || []) for (const [k, x] of Object.entries(c.p)) {
    if (!out[k] || x.v < out[k].v) out[k] = { v: x.v, who: [c.c] };
    else if (x.v === out[k].v) out[k].who.push(c.c);
  }
  return out;
}
function pumps() {
  const P = D.pumps;
  if (!P || !P.chains || !P.chains.length) return '<p class="en-note">Pumpepriserne kunne ikke hentes lige nu.</p>';
  const low = lowest();
  // never more than three price columns on a phone: premium and HVO get a table of their own
  const table = (keys, first) => {
    const cols = keys.filter(k => P.chains.some(c => c.p[k]));
    if (!cols.length) return '';
    let t = `<table class="en-pump"><thead><tr><th>${first}</th>${cols.map(k => `<th>${esc(PUMP[k])}</th>`).join('')}</tr></thead><tbody>`;
    for (const c of P.chains) {
      if (!cols.some(k => c.p[k])) continue;
      t += `<tr><td><b>${esc(c.c)}</b>${first === 'Kæde' ? `<small>${c.n} stationer${c.chg ? ' · ændret ' + esc(when(c.chg)) : ''}</small>` : ''}</td>`;
      t += cols.map(k => {
        const x = c.p[k];
        if (!x) return '<td>–</td>';
        const cheaper = x.min < x.v - 1e-9 ? `<small>fra ${nf(x.min, 2)}</small>` : '';
        return `<td class="${low[k] && x.v === low[k].v ? 'low' : ''}">${nf(x.v, 2)}${cheaper}</td>`;
      }).join('') + '</tr>';
    }
    return t + '</tbody></table>';
  };
  let t = table(['benzin', 'diesel'], 'Kæde');
  if (pumpPlus) t += '<div style="height:14px"></div>' + table(['benzin_plus', 'diesel_plus', 'hvo'], 'Premium');
  const rb = D.s.rbob_kr, ul = D.s.ulsd_kr;
  const raw = rb && ul && low.benzin && low.diesel
    ? `<p class="en-note">Af en liter er <b>${nf(rb.v, 2)} kr.</b> selve benzinen og <b>${nf(ul.v, 2)} kr.</b> selve dieselen på råvaremarkedet – resten er afgifter, moms, transport og avance.</p>` : '';
  const cheap = [];
  for (const c of P.chains) for (const k of ['benzin', 'diesel']) {
    const x = c.p[k];
    if (x && x.min < x.v - 1e-9 && x.at && x.at.length) cheap.push(`${esc(c.c)} ${esc(x.at.join(', '))}: ${PUMP[k].toLowerCase()} ${nf(x.min, 2)}`);
  }
  const listNote = `<p class="en-note">Kædernes listepris i kr. pr. liter (den pris de fleste stationer har)${cheap.length ? '. Billigere enkeltstationer: ' + cheap.slice(0, 4).join(' · ') : ''}.</p>`;
  const hist = (P.h || []).length >= 2
    ? '<div class="en-pchart"><div class="en-chart" data-chart="pumps"></div></div>'
    : `<p class="en-note">Prisudviklingen samles fra ${esc(dayLabel((P.h && P.h[0] && P.h[0][0]) || new Date().toISOString().slice(0, 10), { day: 'numeric', month: 'long' }))} og vises her, når der er to dage.</p>`;
  const plus = `<button class="en-plus" id="pumpPlus" aria-expanded="${pumpPlus}">${pumpPlus ? 'Kun benzin og diesel' : 'Premium og HVO'}<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>`;
  return t + listNote + plus + raw + hist;
}
function pumpChart(box) {
  const h = D.pumps.h || [];
  const line = k => h.map(([day, chains]) => {
    const vals = Object.values(chains).map(c => c[k]).filter(v => v != null);
    return vals.length ? [day, Math.min(...vals), dayLabel(day), dayLabel(day)] : null;
  }).filter(Boolean);
  const b = line('benzin'), d = line('diesel');
  const tags = [];
  if (d.length) tags.push({ i: d.length - 1, v: d[d.length - 1][1], dy: -8, text: 'Diesel' });
  if (b.length) tags.push({ i: b.length - 1, v: b[b.length - 1][1], dy: 16, text: 'Benzin' });
  chart(box, [{ pts: d, name: 'Diesel' }, { pts: b, name: 'Benzin', cls: 'two' }], { d: 2, tags });
}
function news() {
  const list = D.news || [];
  if (!list.length) return '';
  // the app's language setting: Danish where there is a Danish version, else the original if readable, else English
  const danish = store.get('danish', true), readable = t => !/[؀-ۿ]/.test(t || '');
  const pick = n => n.ed ? [n.ed, n.kd] : danish && n.da ? [n.da, n.kd] : readable(n.o) ? [n.o, n.k] : [n.en || n.da || n.o, n.en ? n.k : n.kd];
  const tidy = t => (t || '').replace(/^(?:[←-⯿\u{1f000}-\u{1faff}️‍\s]|(?:breaking|urgent|عاجل)\s*[|:\-–]\s*)+/iu, '')
    .replace(/ (['’]s)\b/g, '$1');   // "EU 's" from the machine
  const words = (t, k) => {   // the app's bold: who and where
    let out = esc(t);
    for (const w of k || []) if (w && w.length > 1) out = out.replace(esc(w), `<b>${esc(w)}</b>`);
    return out;
  };
  const shown = newsAll ? list : list.slice(0, 6);
  const rows = shown.map(n => {
    const [t, k] = pick(n);
    return `<div class="story"><a class="row" href="${esc(n.u)}" target="_blank" rel="noopener"><span class="tx"><span class="h">${words(tidy(t), k)}</span><span class="m"><span class="src">${esc(n.s)}</span><span>${esc(when(n.p))}</span>${n.n > 1 ? `<span>${n.n} medier</span>` : ''}</span></span></a></div>`;
  }).join('');
  const moreBtn = !newsAll && list.length > 6 ? `<button class="en-showmore" id="newsMore">${list.length - 6} mere<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>` : '';
  return `<section class="block en-news"><div class="block-h"><h2>Energinyheder</h2></div>${rows}${moreBtn}</section>`;
}
function render() {
  const y = scrollY;
  let html = '';
  const sig = signals();
  if (sig.length) html += `<section class="block"><div class="block-h"><h2>Lige nu</h2></div><ul class="en-sig">${sig.map(s => `<li>${s}</li>`).join('')}</ul></section>`;
  for (const b of BLOCKS) {
    const rows = b.keys.map(rowFor).join('');
    if (!rows && !b.pumps) continue;
    html += `<section class="block"><div class="block-h"><h2>${esc(b.h)}</h2></div>${b.hint ? `<p class="en-hint">${esc(b.hint)}</p>` : ''}`;
    if (b.pumps) html += pumps();
    html += `<div class="en-rows">${rows}</div></section>`;
    if (b.h === 'Danmark') html += news();
  }
  html += `<p class="foot">Futures fra ICE og NYMEX (ca. 10 min. forsinket) · fysiske priser fra det amerikanske energiministerium (EIA), et par dage bagud · pumpepriser fra Circle K og Q8's egne prislister · nyheder fra Khabar.<br>Opdateres hvert 5. minut.</p>`;
  $("#en").innerHTML = html;
  drawCharts();
  scrollTo(0, y);
}

// ---- touch -----------------------------------------------------------------------------------------------------------
$("#en").addEventListener('click', e => {
  const t = e.target;
  const rng = t.closest('[data-range]'), cur = t.closest('[data-curve]');
  if (rng) {
    const k = rng.closest('.en-item').dataset.k;
    range[k] = rng.dataset.range; store.set('enRange', range);
    const box = rng.closest('.en-more'); box.innerHTML = more(k); drawCharts(box);
    return;
  }
  if (cur) {
    curveOf = cur.dataset.curve;
    const box = cur.closest('.en-more'); box.innerHTML = more('curve'); drawCharts(box);
    return;
  }
  if (t.closest('#pumpPlus')) { pumpPlus = !pumpPlus; render(); return; }
  if (t.closest('#newsMore')) { newsAll = true; render(); return; }
  const row = t.closest('.en-row');
  if (!row) return;
  const it = row.closest('.en-item'), k = it.dataset.k;
  if (open.has(k)) open.delete(k); else open.add(k);
  store.set('enOpen', [...open]);
  it.outerHTML = (BLOCKS.some(b => b.keys.includes(k)) ? rowFor(k) : '');
  drawCharts($(`.en-item[data-k="${k}"]`) || document);
});
let resizeT;
addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => D && drawCharts(), 150); });

// ---- data ------------------------------------------------------------------------------------------------------------
async function load() {
  const st = $('#status');
  try {
    const r = await fetch(SRC, { cache: 'no-cache' });
    if (!r.ok) throw new Error(r.status);
    D = await r.json();
    render();
  } catch (e) {
    if (!D) $("#en").innerHTML = '<p class="empty">Priserne kunne ikke hentes lige nu. Prøv igen om lidt.</p>';
  }
  if (D && D.updated) {
    const age = Date.now() - new Date(D.updated);
    st.textContent = age < 6e4 ? 'opdateret nu' : 'opdateret ' + clock(D.updated);
    st.classList.toggle('stale', age > 45 * 6e4);
    $('#dot').classList.toggle('stale', age > 45 * 6e4);
  } else st.textContent = 'ikke hentet';
}
$('#status').addEventListener('click', () => { $('#status').textContent = 'henter …'; load(); });
addEventListener('scroll', () => $('#bar').classList.toggle('scrolled', scrollY > 4), { passive: true });
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
setInterval(() => { if (!document.hidden) load(); }, 5 * 60e3);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('../sw.js').catch(() => {});
load();
