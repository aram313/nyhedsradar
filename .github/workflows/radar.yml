name: Radar

# Every 5 minutes (GitHub often runs it a little later): fetch all sources, score, notify,
# and save the result on the "data" branch, which the phone app reads.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # exit code 2 means the branch does not exist yet (a first run); any other failure (network) must stop the
      # job – starting empty would overwrite 30 days of learning and the notification history
      - name: Get saved state
        run: |
          mkdir -p state
          rc=0; git ls-remote --exit-code --heads origin data >/dev/null || rc=$?
          if [ "$rc" -eq 0 ]; then
            git fetch --depth=1 origin data
            git archive FETCH_HEAD | tar -x -C state
          elif [ "$rc" -ne 2 ]; then
            echo "Could not reach the data branch (exit $rc) – stopping rather than starting empty"; exit 1
          fi

      # digest.json (the overview of the day), live.json (the editor's level for Live, src/radar/level.py; until the
      # editor writes one the level is 'normal') and summaries.json (the editor's headlines, for the notifications)
      - name: Get the editor's latest overview and level
        run: |
          mkdir -p .cache
          if git ls-remote --exit-code --heads origin digest >/dev/null; then
            git fetch --depth=1 origin digest
            git show FETCH_HEAD:digest.json > .cache/digest.json || true
            git show FETCH_HEAD:live.json > .cache/live.json 2>/dev/null || rm -f .cache/live.json
            git show FETCH_HEAD:summaries.json > .cache/summaries.json 2>/dev/null || rm -f .cache/summaries.json
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Cache language model and profile
        id: models
        uses: actions/cache@v4
        with:
          path: .cache
          # not keyed on settings.json: a changed setting must not send every run back to downloading ~270 MB of
          # models; restore-keys brings back the newest earlier cache when the key does change
          key: radar-${{ hashFiles('config/profile.enc', 'requirements.txt', 'src/radar/translate.py') }}
          restore-keys: radar-

      # a fresh cache is saved at the end of this run, so it must hold every translation model, not only the
      # ones this run happens to need (otherwise later runs download the missing one again and again)
      - name: Fetch all translation models into a fresh cache
        if: steps.models.outputs.cache-hit != 'true'
        env:
          PYTHONPATH: src
        run: python -c "from radar.translate import MODELS, Translator; t = Translator('.cache'); [t._load(p) for p in MODELS]"

      - name: Unlock profile
        env:
          PROFILE_KEY: ${{ secrets.PROFILE_KEY }}
        run: |
          mkdir -p .cache
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in config/profile.enc -out .cache/profile.jsonl -pass env:PROFILE_KEY

      - name: Run radar
        env:
          PYTHONPATH: src
          RADAR_STATE: state
          RADAR_DIGEST: .cache/digest.json
          RADAR_LIVE: .cache/live.json              # the editor's level for Live; app.json holds what Live shows
          RADAR_SUMMARIES: .cache/summaries.json    # the editor's headlines: a notification says what the app shows
          RADAR_ANALYSES: '1'                       # follow Hizb ut-Tahrir's new political answers (analyses.py)
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}       # checks the owner's long-press removals from the app (admin.py)
          PROFILE_KEY: ${{ secrets.PROFILE_KEY }}   # encrypts the list of signed-up phones (state/phones.bin)
          PUSH_SUBS: ${{ secrets.PUSH_SUBS }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          VAPID_SUBJECT: https://${{ github.repository_owner }}.github.io
          FEEDBACK_TOPIC: ${{ vars.FEEDBACK_TOPIC }}
        run: python -m radar.run

      # the economy page khabar.nu/energi (src/radar/energy.py, stdlib only): each source on its own clock inside, the last
      # good numbers kept when one fails – and a failure here never stops the state from being saved
      - name: Energy prices
        continue-on-error: true
        timeout-minutes: 3
        env:
          PYTHONPATH: src
          RADAR_STATE: state
          RADAR_SUMMARIES: .cache/summaries.json    # the editor's headlines for the energy news
        run: python -m radar.energy

      # the Kalender tab's planned events (src/radar/calendar.py, stdlib only): Wikipedia's electoral calendars, the Fed's
      # and the ECB's rate meetings and config/calendar.json – each source on its own daily
      # clock, the last good items kept when one fails; a failure here never stops the state from being saved
      - name: Calendar
        continue-on-error: true
        timeout-minutes: 3
        env:
          PYTHONPATH: src
          RADAR_STATE: state
        run: python -m radar.calendar

      # the map (src/radar/osint.py) is shelved since 17/10 at the owner's wish (the Kort tab is gone from the app):
      # the step stays, switched off, for when it returns
      - name: Map
        if: false
        continue-on-error: true
        timeout-minutes: 2
        env:
          PYTHONPATH: src
          RADAR_STATE: state
          RADAR_SUMMARIES: .cache/summaries.json    # the editor's headlines for the map's events
        run: python -m radar.osint

      # the editor's quarter-hour look (scripts/editor.py gate, plain Python, no tokens): when something of weight has
      # happened since the last update, it fires the editor's Claude routine through its API trigger – at most
      # editor_fires_per_day (config/settings.json) a Danish day, spread over the day; the fires are kept in
      # state/editor-gate.json. Without the two secrets it only looks (a dry run). A failure here never stops the save.
      - name: Editor's quarter-hour look
        continue-on-error: true
        timeout-minutes: 3
        env:
          PYTHONPATH: src
          ROUTINE_FIRE_URL: ${{ secrets.ROUTINE_FIRE_URL }}
          ROUTINE_FIRE_TOKEN: ${{ secrets.ROUTINE_FIRE_TOKEN }}
        run: |
          git fetch -q --depth=1 origin +refs/heads/digest:refs/remotes/origin/digest || true
          if [ -n "$ROUTINE_FIRE_URL" ] && [ -n "$ROUTINE_FIRE_TOKEN" ]; then fire=--fire; else fire=; fi
          python scripts/editor.py gate --data-dir state $fire

      - name: Save state
        run: |
          rm -f .cache/profile.jsonl .cache/digest.json .cache/live.json .cache/summaries.json
          cd state
          git init -q -b data
          git config user.name "radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "radar $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data

      - name: Keep the schedule switched on
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/radar.yml/enable" || true
