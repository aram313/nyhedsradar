name: App

# Publishes the phone app (the public/ folder) to GitHub Pages whenever it changes.
on:
  push:
    branches: [main]
    paths: ['public/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Write app settings
        run: |
          cat > public/config.js <<CFG
          window.RADAR_CONFIG = {
            dataUrl: "https://raw.githubusercontent.com/${{ github.repository }}/data/data.json",
            appUrl: "https://raw.githubusercontent.com/${{ github.repository }}/data/app.json",
            digestUrl: "https://raw.githubusercontent.com/${{ github.repository }}/digest/digest.json",
            searchUrl: "https://raw.githubusercontent.com/${{ github.repository }}/data/search.json",
            movesUrl: "https://raw.githubusercontent.com/${{ github.repository }}/digest/moves.json",
            frontUrl: "https://raw.githubusercontent.com/${{ github.repository }}/digest/front.json",
            answersUrl: "https://raw.githubusercontent.com/${{ github.repository }}/digest/answers.json",
            analysesUrl: "https://raw.githubusercontent.com/${{ github.repository }}/data/analyses.json",
            energyUrl: "https://raw.githubusercontent.com/${{ github.repository }}/data/energy.json",
            mapUrl: "https://raw.githubusercontent.com/${{ github.repository }}/data/map.json",
            cartoKey: "${{ vars.CARTO_KEY }}",
            vapidPublicKey: "${{ vars.VAPID_PUBLIC }}",
            feedbackTopic: "${{ vars.FEEDBACK_TOPIC }}"
          };
          CFG
          sed -i -E "s/radar-shell-v[0-9]+/radar-shell-${GITHUB_SHA::8}/" public/sw.js
          rm -f public/data.json
      - uses: actions/configure-pages@v5
      # stay on v3 (or v5 with include-hidden-files: true): v4 silently drops dot-folders such as .well-known,
      # which the Android app (assetlinks.json) needs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
