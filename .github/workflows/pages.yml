name: App

# Publishes the phone app (the public/ folder) to GitHub Pages whenever it changes.
on:
  push:
    branches: [main]
    paths: ['public/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Write app settings
        run: |
          cat > public/config.js <<CFG
          window.RADAR_CONFIG = {
            dataUrl: "https://raw.githubusercontent.com/${{ github.repository }}/data/data.json",
            digestUrl: "https://raw.githubusercontent.com/${{ github.repository }}/digest/digest.json",
            vapidPublicKey: "${{ vars.VAPID_PUBLIC }}",
            feedbackTopic: "${{ vars.FEEDBACK_TOPIC }}"
          };
          CFG
          sed -i "s/radar-shell-v1/radar-shell-${GITHUB_SHA::8}/" public/sw.js
          rm -f public/data.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
